<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- domain constants ----------
const CATEGORIES = {
  "葉物野菜": { n: 3.4 }, "根菜・果菜": { n: 1.9 }, "肉・魚": { n: 2.6 },
  "乳製品・卵": { n: 2.2 }, "冷凍食品": { n: 1.1 }, "調味料・乾物": { n: 1.05 }, "その他": { n: 2.0 },
};
const CATEGORY_LIST = Object.keys(CATEGORIES);
const SLOT_LIST = ["朝", "昼", "間食", "晩"];
const STORAGE_KEY = "mas-ledger-data-v2";
const GOODWILL_RATE = 12;
const AMORT_DAYS = 7;
const GOODWILL_ALERT = 150;

const todayStr = () => new Date().toISOString().slice(0, 10);
const uid = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const yen = (v) => `¥${Math.round(v).toLocaleString("ja-JP")}`;
const fmtDate = (d) => { const dt = new Date(d); return `${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日`; };
const daysSince = (dateStr) => {
  const d = new Date(dateStr); d.setHours(0, 0, 0, 0);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((t - d) / 86400000));
};
function freshnessRatio(item) {
  const purchase = new Date(item.purchaseDate);
  const expiry = new Date(item.expiryDate);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const total = Math.max(1, Math.round((expiry - purchase) / 86400000));
  const remain = Math.round((expiry - today) / 86400000);
  if (remain <= 0) return { ratio: 0, remainDays: remain };
  const linear = Math.min(1, remain / total);
  const n = (CATEGORIES[item.category] || CATEGORIES["その他"]).n;
  return { ratio: Math.pow(linear, n), remainDays: remain };
}
const bookValue = (item) => (item.disposed ? 0 : item.cost * item.qtyRemaining * freshnessRatio(item).ratio);
const goodwillInitial = (meal) => meal.satisfaction * GOODWILL_RATE;
const goodwillRemaining = (meal) => goodwillInitial(meal) * Math.max(0, 1 - daysSince(meal.date) / AMORT_DAYS);

// ---------- tiny inline icons ----------
const IconTrash = (p) => <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg>;
const IconCamera = (p) => <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>;
const IconAlert = (p) => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>;
const IconCheck = (p) => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M20 6 9 17l-5-5"/></svg>;
const IconPlus = (p) => <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M12 5v14M5 12h14"/></svg>;
const Spinner = () => <span className="inline-block w-3.5 h-3.5 rounded-full border-2 animate-spin" style={{ borderColor: "#F6F4EE", borderTopColor: "transparent" }} />;

// ---------- UI atoms ----------
const Field = ({ label, children }) => (
  <label className="block mb-3">
    <span className="block text-xs mb-1" style={{ color: "#6b675c" }}>{label}</span>
    {children}
  </label>
);
const inputCls = "w-full bg-transparent border-b px-1 py-1 text-sm focus:outline-none focus:border-b-2";
const inputStyle = { borderColor: "#c9c2b2", color: "#24262a" };
function FreshnessBar({ ratio }) {
  const color = ratio > 0.5 ? "#3E6B54" : ratio > 0.2 ? "#A9812F" : "#A63B2E";
  return <div className="w-full h-1.5" style={{ background: "#e2ddcf" }}>
    <div style={{ width: `${Math.max(2, ratio * 100)}%`, background: color, height: "100%" }} />
  </div>;
}
function TabButton({ active, onClick, label }) {
  return (
    <button onClick={onClick} className="px-3 py-2 text-xs sm:text-sm shrink-0"
      style={{
        borderTop: active ? "2px solid #A63B2E" : "2px solid transparent",
        borderLeft: "1px solid #d8d2c2", borderRight: "1px solid #d8d2c2",
        background: active ? "#F6F4EE" : "#E4E0D3", color: active ? "#24262a" : "#6b675c",
        fontWeight: active ? 600 : 400,
      }}>{label}</button>
  );
}
function AmountRow({ label, value, bold, color }) {
  return (
    <div className="flex justify-between ledger-row py-1.5">
      <span className={bold ? "font-medium" : ""}>{label}</span>
      <span className={`mas-mono ${bold ? "font-medium" : ""}`} style={{ color: color || "#24262a" }}>{yen(value)}</span>
    </div>
  );
}
function MiniLineChart({ data, series }) {
  const w = 640, h = 260, pad = 38;
  const allVals = data.flatMap((d) => series.map((s) => d[s.key]));
  const maxV = Math.max(10, ...allVals), minV = Math.min(0, ...allVals);
  const xFor = (i) => pad + (i * (w - 2 * pad)) / Math.max(1, data.length - 1);
  const yFor = (v) => h - pad - ((v - minV) * (h - 2 * pad)) / Math.max(1, maxV - minV);
  const step = Math.max(1, Math.ceil(data.length / 6));
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ height: 260 }}>
        <line x1={pad} y1={h - pad} x2={w - pad} y2={h - pad} stroke="#ddd7c8" />
        {series.map((s) => (
          <polyline key={s.key} fill="none" stroke={s.color} strokeWidth="2"
            points={data.map((d, i) => `${xFor(i)},${yFor(d[s.key])}`).join(" ")} />
        ))}
        {data.map((d, i) => i % step === 0 && (
          <text key={i} x={xFor(i)} y={h - pad + 14} fontSize="9" textAnchor="middle" fill="#6b675c">{d.date}</text>
        ))}
      </svg>
      <div className="flex flex-wrap gap-3 text-xs mt-1">
        {series.map((s) => (
          <span key={s.key} className="flex items-center gap-1">
            <span className="inline-block w-2.5 h-2.5" style={{ background: s.color }} /> {s.label}
          </span>
        ))}
      </div>
    </div>
  );
}

// ---------- main app ----------
function App() {
  const [items, setItems] = useState([]);
  const [meals, setMeals] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("inventory");

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { const p = JSON.parse(raw); setItems(p.items || []); setMeals(p.meals || []); }
    } catch (e) { /* start fresh */ }
    setLoaded(true);
  }, []);
  useEffect(() => {
    if (!loaded) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, meals })); } catch (e) { /* storage unavailable */ }
  }, [items, meals, loaded]);

  // ---- inventory form ----
  const [form, setForm] = useState({ name: "", category: CATEGORY_LIST[0], cost: "", unitLabel: "1点", purchaseDate: todayStr(), expiryDate: "" });
  const addItem = () => {
    if (!form.name || !form.cost || !form.expiryDate) return;
    setItems((prev) => [...prev, { id: uid(), name: form.name, category: form.category, cost: Number(form.cost), unitLabel: form.unitLabel, purchaseDate: form.purchaseDate, expiryDate: form.expiryDate, qtyRemaining: 1, disposed: false }]);
    setForm({ ...form, name: "", cost: "", unitLabel: "1点", expiryDate: "" });
  };
  const disposeItem = (id) => setItems((prev) => prev.map((it) => it.id === id ? { ...it, disposed: true, disposalLoss: bookValue(it), disposalDate: todayStr() } : it));

  // ---- meal entry ----
  const [mealDraft, setMealDraft] = useState({ name: "", date: todayStr(), slot: "昼", cookMin: 10, eatMin: 15, satisfaction: 6, nutrition: 6, health: 0 });
  const [portions, setPortions] = useState({});
  const addMeal = () => {
    if (!mealDraft.name) return;
    const chosen = Object.entries(portions).filter(([, v]) => v > 0);
    if (chosen.length === 0) return;
    const ingredientsUsed = [];
    setItems((prev) => prev.map((it) => {
      const p = portions[it.id];
      if (p > 0 && !it.disposed) {
        const frac = p / 100;
        ingredientsUsed.push({ name: it.name, costConsumed: it.cost * it.qtyRemaining * frac });
        return { ...it, qtyRemaining: it.qtyRemaining * (1 - frac) };
      }
      return it;
    }));
    setMeals((prev) => [...prev, { id: uid(), ...mealDraft, ingredients: ingredientsUsed }]);
    setMealDraft({ ...mealDraft, name: "" });
    setPortions({});
  };
  const activeItems = items.filter((it) => !it.disposed && it.qtyRemaining > 0.02);

  // ---- derived ledger ----
  const ledger = useMemo(() => {
    const capitalTotal = items.reduce((s, it) => s + it.cost, 0);
    const foodAssetNow = items.reduce((s, it) => s + bookValue(it), 0);
    const mealCostTotal = meals.reduce((s, m) => s + m.ingredients.reduce((s2, i) => s2 + i.costConsumed, 0), 0);
    const valuationLossTotal = Math.max(0, capitalTotal - mealCostTotal - foodAssetNow);
    const goodwillInitTotal = meals.reduce((s, m) => s + goodwillInitial(m), 0);
    const goodwillNow = meals.reduce((s, m) => s + goodwillRemaining(m), 0);
    const amortTotal = Math.max(0, goodwillInitTotal - goodwillNow);
    const revenueTotal = goodwillInitTotal;
    const netIncome = revenueTotal - mealCostTotal - valuationLossTotal - amortTotal;
    const totalAssets = foodAssetNow + goodwillNow;
    const totalEquity = capitalTotal + netIncome;
    return { capitalTotal, foodAssetNow, mealCostTotal, valuationLossTotal, goodwillInitTotal, goodwillNow, amortTotal, revenueTotal, netIncome, totalAssets, totalEquity, diff: totalAssets - totalEquity };
  }, [items, meals]);

  const journal = useMemo(() => {
    const rows = [];
    items.forEach((it) => rows.push({ date: it.purchaseDate, label: "① 食材購入", debit: "食材資産", credit: "元入資本", amount: it.cost, memo: it.name }));
    meals.forEach((m) => m.ingredients.forEach((ing) => rows.push({ date: m.date, label: "③ 食費計上", debit: "食費", credit: "食材資産", amount: ing.costConsumed, memo: `${m.name}(${ing.name})` })));
    items.filter((it) => it.disposed).forEach((it) => rows.push({ date: it.disposalDate || it.purchaseDate, label: "評価損(廃棄)", debit: "評価損", credit: "食材資産", amount: it.disposalLoss || 0, memo: it.name }));
    meals.forEach((m) => rows.push({ date: m.date, label: "④ 満足のれん計上", debit: "満足のれん", credit: "摂取収益", amount: goodwillInitial(m), memo: m.name }));
    return rows.sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [items, meals]);

  const provisions = useMemo(() => {
    let spoilReserve = 0; const atRisk = [];
    items.forEach((it) => {
      if (it.disposed) return;
      const { ratio } = freshnessRatio(it);
      if (ratio > 0 && ratio <= 0.3) { const loss = it.cost * it.qtyRemaining * (1 - ratio) * 0.5; spoilReserve += loss; atRisk.push({ ...it, ratio, loss }); }
    });
    const overGoodwill = ledger.goodwillNow > GOODWILL_ALERT;
    const goodwillProvision = overGoodwill ? (ledger.goodwillNow - GOODWILL_ALERT) * 0.3 : 0;
    return { spoilReserve, atRisk, overGoodwill, goodwillProvision };
  }, [items, ledger.goodwillNow]);

  const chartData = useMemo(() => {
    const days = [...new Set(meals.map((m) => m.date))].sort();
    let cumRevenue = 0, cumCost = 0;
    return days.map((d) => {
      const dayMeals = meals.filter((m) => m.date === d);
      cumRevenue += dayMeals.reduce((s, m) => s + goodwillInitial(m), 0);
      cumCost += dayMeals.reduce((s, m) => s + m.ingredients.reduce((s2, i) => s2 + i.costConsumed, 0), 0);
      return { date: d.slice(5), revenue: Math.round(cumRevenue), cost: Math.round(cumCost), nutrition: dayMeals.reduce((s, m) => s + m.nutrition * 5, 0), health: dayMeals.reduce((s, m) => s + m.health, 0) };
    });
  }, [meals]);

  return (
    <div className="w-full min-h-screen" style={{ background: "#EDEAE2", color: "#24262a" }}>
      <div className="flex items-start justify-between px-4 pt-5 pb-3 flex-wrap gap-2" style={{ borderBottom: "2px solid #24262a" }}>
        <div>
          <h1 className="mas-serif text-xl sm:text-2xl" style={{ letterSpacing: "0.02em" }}>冷蔵庫会計基準 総勘定元帳</h1>
          <p className="text-xs mt-1" style={{ color: "#6b675c" }}>Meal Accounting Standards — 複式簿記版</p>
        </div>
        <div className="mas-mono text-xs px-3 py-1.5" style={{ border: "1px solid #A63B2E", color: "#A63B2E", transform: "rotate(-2deg)" }}>本日 {fmtDate(todayStr())}</div>
      </div>

      <div className="flex flex-wrap gap-0 px-4 pt-4">
        <TabButton active={tab === "inventory"} onClick={() => setTab("inventory")} label="資産台帳" />
        <TabButton active={tab === "entry"} onClick={() => setTab("entry")} label="仕訳(食事記録)" />
        <TabButton active={tab === "journal"} onClick={() => setTab("journal")} label="仕訳帳" />
        <TabButton active={tab === "bs"} onClick={() => setTab("bs")} label="貸借対照表・損益計算書" />
        <TabButton active={tab === "dashboard"} onClick={() => setTab("dashboard")} label="ダッシュボード" />
        <TabButton active={tab === "notes"} onClick={() => setTab("notes")} label="注記" />
      </div>

      <div className="p-4" style={{ background: "#F6F4EE", minHeight: "60vh" }}>
        {tab === "inventory" && (
          <div className="space-y-6">
            <div>
              <h2 className="mas-serif text-lg mb-3">食材を資産計上する</h2>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-x-4">
                <Field label="品目名"><input className={inputCls} style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="例: ほうれん草" /></Field>
                <Field label="分類"><select className={inputCls} style={inputStyle} value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>{CATEGORY_LIST.map((c) => <option key={c} value={c}>{c}</option>)}</select></Field>
                <Field label="取得原価(円)"><input type="number" className={inputCls} style={inputStyle} value={form.cost} onChange={(e) => setForm({ ...form, cost: e.target.value })} placeholder="298" /></Field>
                <Field label="数量表記"><input className={inputCls} style={inputStyle} value={form.unitLabel} onChange={(e) => setForm({ ...form, unitLabel: e.target.value })} placeholder="1袋" /></Field>
                <Field label="購入日"><input type="date" className={inputCls} style={inputStyle} value={form.purchaseDate} onChange={(e) => setForm({ ...form, purchaseDate: e.target.value })} /></Field>
                <Field label="消費期限"><input type="date" className={inputCls} style={inputStyle} value={form.expiryDate} onChange={(e) => setForm({ ...form, expiryDate: e.target.value })} /></Field>
              </div>
              <button onClick={addItem} className="flex items-center gap-1 text-sm px-3 py-1.5 mt-1" style={{ background: "#24262a", color: "#F6F4EE" }}><IconPlus /> 資産計上する</button>
            </div>

            <div>
              <h2 className="mas-serif text-lg mb-2">資産台帳(在庫一覧)</h2>
              {activeItems.length === 0 ? <p className="text-sm" style={{ color: "#6b675c" }}>まだ何も計上されていません。</p> : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead><tr className="text-left ledger-row"><th className="py-2 pr-2">品目</th><th className="py-2 pr-2">分類</th><th className="py-2 pr-2">鮮度資本</th><th className="py-2 pr-2 mas-mono text-right">残存日数</th><th className="py-2 pr-2 mas-mono text-right">帳簿価額</th><th className="py-2"></th></tr></thead>
                    <tbody>
                      {activeItems.map((it) => {
                        const { ratio, remainDays } = freshnessRatio(it); const spoiled = ratio === 0;
                        return (
                          <tr key={it.id} className="ledger-row align-middle">
                            <td className="py-2 pr-2">{it.name}<span className="block text-xs" style={{ color: "#948e80" }}>{it.unitLabel} ・残{Math.round(it.qtyRemaining * 100)}%</span></td>
                            <td className="py-2 pr-2 text-xs">{it.category}</td>
                            <td className="py-2 pr-2 w-28"><FreshnessBar ratio={ratio} /></td>
                            <td className="py-2 pr-2 mas-mono text-right" style={{ color: spoiled ? "#A63B2E" : "#24262a" }}>{spoiled ? "期限切れ" : `${remainDays}日`}</td>
                            <td className="py-2 pr-2 mas-mono text-right">{yen(bookValue(it))}</td>
                            <td className="py-2 text-right"><button onClick={() => disposeItem(it.id)} title="廃棄処理"><IconTrash color="#A63B2E" /></button></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
            {provisions.atRisk.length > 0 && (
              <div className="text-sm px-3 py-2 flex gap-2" style={{ background: "#f3ebd9", border: "1px solid #A9812F" }}>
                <IconAlert color="#A9812F" />
                <div><p className="font-medium">傷みそうな野菜引当金:{yen(provisions.spoilReserve)}</p><p className="text-xs mt-0.5" style={{ color: "#6b675c" }}>{provisions.atRisk.map((a) => a.name).join("、")} の鮮度資本が30%以下です。</p></div>
              </div>
            )}
          </div>
        )}

        {tab === "entry" && (
          <div className="space-y-6">
            <h2 className="mas-serif text-lg">食事を仕訳する</h2>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-x-4">
              <Field label="料理名"><input className={inputCls} style={inputStyle} value={mealDraft.name} onChange={(e) => setMealDraft({ ...mealDraft, name: e.target.value })} placeholder="例: 野菜炒め" /></Field>
              <Field label="日付"><input type="date" className={inputCls} style={inputStyle} value={mealDraft.date} onChange={(e) => setMealDraft({ ...mealDraft, date: e.target.value })} /></Field>
              <Field label="時間帯"><select className={inputCls} style={inputStyle} value={mealDraft.slot} onChange={(e) => setMealDraft({ ...mealDraft, slot: e.target.value })}>{SLOT_LIST.map((s) => <option key={s} value={s}>{s}</option>)}</select></Field>
              <Field label={`調理時間 ${mealDraft.cookMin}分`}><input type="range" min="0" max="90" value={mealDraft.cookMin} onChange={(e) => setMealDraft({ ...mealDraft, cookMin: Number(e.target.value) })} className="w-full" /></Field>
              <Field label={`喫食時間 ${mealDraft.eatMin}分`}><input type="range" min="0" max="60" value={mealDraft.eatMin} onChange={(e) => setMealDraft({ ...mealDraft, eatMin: Number(e.target.value) })} className="w-full" /></Field>
              <Field label={`満足度 ${mealDraft.satisfaction}/10(のれん計上の元)`}><input type="range" min="1" max="10" value={mealDraft.satisfaction} onChange={(e) => setMealDraft({ ...mealDraft, satisfaction: Number(e.target.value) })} className="w-full" /></Field>
              <Field label={`栄養 ${mealDraft.nutrition}/10`}><input type="range" min="1" max="10" value={mealDraft.nutrition} onChange={(e) => setMealDraft({ ...mealDraft, nutrition: Number(e.target.value) })} className="w-full" /></Field>
              <Field label={`健康影響 ${mealDraft.health > 0 ? "+" : ""}${mealDraft.health}`}><input type="range" min="-5" max="5" value={mealDraft.health} onChange={(e) => setMealDraft({ ...mealDraft, health: Number(e.target.value) })} className="w-full" /></Field>
            </div>
            <div>
              <h3 className="text-sm font-medium mb-2">使用する食材(資産台帳から払い出し)</h3>
              {activeItems.length === 0 ? <p className="text-sm" style={{ color: "#6b675c" }}>資産台帳に食材がありません。</p> : (
                <div className="space-y-2">
                  {activeItems.map((it) => (
                    <div key={it.id} className="flex items-center gap-3 ledger-row py-2">
                      <span className="text-sm w-28 shrink-0">{it.name}</span>
                      <input type="range" min="0" max="100" value={portions[it.id] || 0} onChange={(e) => setPortions((p) => ({ ...p, [it.id]: Number(e.target.value) }))} className="flex-1" />
                      <span className="mas-mono text-xs w-24 text-right shrink-0">残りの{portions[it.id] || 0}%使用</span>

          </div>

              <div className="overflow-x-auto">

                  <tbody>{journal.map((r, idx) => (
                    <tr key={idx} className="ledger-row">
                      <td className="py-1.5 pr-2 mas-mono text-xs">{r.date}</td><td className="py-1.5 pr-2 text-xs">{r.label}</td>
                      <td className="py-1.5 pr-2">{r.debit}</td><td className="py-1.5 pr-2">{r.credit}</td>
                      <td className="py-1.5 pr-2 mas-mono text-right">{yen(r.amount)}</td><td className="py-1.5 pr-2 text-xs" style={{ color: "#6b675c" }}>{r.memo}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>

          <div className="space-y-8">

              <h2 className="mas-serif text-lg mb-3">貸借対照表(現時点)</h2>

                  <AmountRow label="食材資産" value={ledger.foodAssetNow} />
                  <AmountRow label="満足のれん" value={ledger.goodwillNow} />
                  <AmountRow label="資産合計" value={ledger.totalAssets} bold />
                </div>
                <div>
                  <p className="text-xs font-medium mb-1" style={{ color: "#6b675c" }}>負債の部</p>
                  <AmountRow label="(本モデルでは負債を認識しない)" value={0} />

          <div className="max-w-2xl space-y-4 text-sm" style={{ lineHeight: 1.8 }}>
            <h2 className="mas-serif text-lg mb-1">注記:会計方針</h2>
            <p>本アプリは複式簿記の作法に沿った「食事会計基準(Meal Accounting Standards)」に基づく。すべての取引を借方・貸方の対で記帳することで、貸借対照表は常に自動的に一致する。負債は認識しない設計とした。</p>
            <div><p className="font-medium">① 食材購入</p><p>(借)食材資産 / (貸)元入資本。</p></div>
            <div><p className="font-medium">② 鮮度資本の逓減</p><p>残存日数の^nカーブで時価評価。含み損は消費・廃棄時に評価損として実現(残差:元入資本−食費−現在の食材資産)。</p></div>
            <div><p className="font-medium">③ 食費計上</p><p>(借)食費 / (貸)食材資産。</p></div>
            <div><p className="font-medium">④ 満足のれん計上・⑤ 償却</p><p>(借)満足のれん / (貸)摂取収益。{AMORT_DAYS}日で定額償却(残差:摂取収益−現在ののれん残高)。</p></div>
            <div><p className="font-medium">引当金</p><p>鮮度資本30%以下で「傷みそうな野菜引当金」、未償却のれんが閾値超過で「満足のれん超過引当金」を開示。</p></div>
            <div><p className="font-medium">データの保存</p><p>入力データはこのブラウザ内にのみ保存される。</p></div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
